<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Triple Threat Arena Simulator Logo">
  <title>Triple Threat Arena Simulator</title>
  <desc>Cinematic 3D fight simulator logo featuring an octagon ring with three fighter silhouettes under volumetric spotlights.</desc>

  <defs>
    <!-- Background gradient: deep night-sky blue/violet to black -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="60%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Octagon ring gradient: amber/gold metallic -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Inner octagon floor -->
    <radialGradient id="floorGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1d2c"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </radialGradient>

    <!-- Spotlight gradients -->
    <linearGradient id="spot1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.45)"/>
      <stop offset="100%" stop-color="rgba(239, 68, 68, 0)"/>
    </linearGradient>
    <linearGradient id="spot2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.45)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </linearGradient>
    <linearGradient id="spot3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.5)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </linearGradient>

    <!-- Title text gradient: gold chrome -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter (bigger) -->
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Octagon path definition (regular 8-sided) -->
    <symbol id="octagon" viewBox="-100 -100 200 200">
      <polygon points="92.4,-38.3 38.3,-92.4 -38.3,-92.4 -92.4,-38.3 -92.4,38.3 -38.3,92.4 38.3,92.4 92.4,38.3"/>
    </symbol>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid scanlines for HD broadcast feel -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- ============ VOLUMETRIC SPOTLIGHTS (3 cones for the 3 fighters) ============ -->
  <g opacity="0.55" filter="url(#bigGlow)">
    <!-- Left red spotlight (Trump) -->
    <polygon points="170,30 200,30 100,360 70,360" fill="url(#spot1)"/>
    <!-- Center amber spotlight (Kim) -->
    <polygon points="380,30 420,30 415,360 385,360" fill="url(#spot3)"/>
    <!-- Right blue spotlight (Putin) -->
    <polygon points="610,30 640,30 740,360 710,360" fill="url(#spot2)"/>
  </g>

  <!-- Spotlight bulbs at top -->
  <g filter="url(#glow)">
    <circle cx="185" cy="30" r="6" fill="#ef4444"/>
    <circle cx="400" cy="30" r="7" fill="#f59e0b"/>
    <circle cx="625" cy="30" r="6" fill="#3b82f6"/>
  </g>

  <!-- ============ OCTAGON RING (perspective view) ============ -->
  <g transform="translate(400 280)">
    <!-- Outer ring base shadow -->
    <ellipse cx="0" cy="55" rx="225" ry="55" fill="#000000" opacity="0.6"/>

    <!-- Octagon ring floor (isometric perspective) -->
    <g transform="scale(1, 0.45)">
      <use href="#octagon" x="-110" y="-110" width="220" height="220" fill="url(#floorGrad)" stroke="url(#ringGrad)" stroke-width="3"/>
    </g>

    <!-- Inner mat boundary -->
    <g transform="scale(0.55, 0.27)">
      <use href="#octagon" x="-100" y="-100" width="200" height="200" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- Ring center logo text -->
    <text x="0" y="3" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="700" fill="#fbbf24" opacity="0.35" letter-spacing="2">TRIPLE THREAT</text>

    <!-- Octagon fence pillars (8 vertical bars) -->
    <g stroke="#fbbf24" stroke-width="2.5" opacity="0.85" filter="url(#glow)">
      <!-- 8 pillars around the perimeter -->
      <line x1="0" y1="-100" x2="0" y2="-50"/>
      <line x1="70.7" y1="-70.7" x2="35.4" y2="-35.4"/>
      <line x1="100" y1="0" x2="50" y2="0"/>
      <line x1="70.7" y1="70.7" x2="35.4" y2="35.4"/>
      <line x1="0" y1="100" x2="0" y2="50"/>
      <line x1="-70.7" y1="70.7" x2="-35.4" y2="35.4"/>
      <line x1="-100" y1="0" x2="-50" y2="0"/>
      <line x1="-70.7" y1="-70.7" x2="-35.4" y2="-35.4"/>
    </g>

    <!-- Spotlight bulbs on top pillars -->
    <g fill="#fef3c7" filter="url(#glow)">
      <circle cx="0" cy="-100" r="2.5"/>
      <circle cx="70.7" cy="-70.7" r="2.5"/>
      <circle cx="100" cy="0" r="2.5"/>
      <circle cx="70.7" cy="70.7" r="2.5"/>
      <circle cx="0" cy="100" r="2.5"/>
      <circle cx="-70.7" cy="70.7" r="2.5"/>
      <circle cx="-100" cy="0" r="2.5"/>
      <circle cx="-70.7" cy="-70.7" r="2.5"/>
    </g>
  </g>

  <!-- ============ 3 FIGHTER SILHOUETTES ON THE RING ============ -->
  <g transform="translate(400 280)">
    <!-- Fighter 1 (Left - Trump - Red) - Tall showman with arm raised -->
    <g transform="translate(-65 0)">
      <!-- Shadow -->
      <ellipse cx="0" cy="35" rx="18" ry="5" fill="#000000" opacity="0.5"/>
      <!-- Legs -->
      <rect x="-6" y="5" width="5" height="30" fill="#dc2626" rx="1"/>
      <rect x="1" y="5" width="5" height="30" fill="#dc2626" rx="1"/>
      <!-- Torso (suit jacket) -->
      <rect x="-9" y="-22" width="18" height="30" fill="#1e3a8a" rx="2"/>
      <!-- Red tie -->
      <rect x="-1.5" y="-18" width="3" height="20" fill="#ef4444"/>
      <!-- Head (orange) -->
      <circle cx="0" cy="-30" r="7" fill="#ffa254" stroke="#fbbf24" stroke-width="0.5"/>
      <!-- Hair (blonde comb) -->
      <path d="M -7,-32 Q 0,-40 7,-32 L 7,-30 Q 0,-37 -7,-30 Z" fill="#fbbf24"/>
      <!-- Raised right arm (signature pose) -->
      <rect x="6" y="-28" width="4" height="18" fill="#1e3a8a" rx="1" transform="rotate(-30 8 -19)"/>
      <circle cx="14" cy="-38" r="3" fill="#dc2626"/>
      <!-- Boxing glove left -->
      <circle cx="-8" cy="-8" r="3.5" fill="#dc2626"/>
    </g>

    <!-- Fighter 2 (Right - Putin - Blue) - Lean judo stance -->
    <g transform="translate(65 5)">
      <!-- Shadow -->
      <ellipse cx="0" cy="30" rx="15" ry="4" fill="#000000" opacity="0.5"/>
      <!-- Legs (judo gi) -->
      <rect x="-5" y="0" width="4" height="28" fill="#f3f4f6" rx="1"/>
      <rect x="1" y="0" width="4" height="28" fill="#f3f4f6" rx="1"/>
      <!-- Black belt -->
      <rect x="-8" y="2" width="16" height="3" fill="#000000"/>
      <!-- Torso (white gi) -->
      <rect x="-8" y="-22" width="16" height="26" fill="#f3f4f6" rx="2"/>
      <!-- Head (pale) -->
      <circle cx="0" cy="-29" r="6" fill="#fed7aa" stroke="#78716c" stroke-width="0.5"/>
      <!-- Hair (shaved) -->
      <path d="M -6,-32 Q 0,-35 6,-32 L 6,-29 Q 0,-32 -6,-29 Z" fill="#78716c"/>
      <!-- Arms in judo guard -->
      <rect x="-12" y="-18" width="4" height="14" fill="#f3f4f6" rx="1" transform="rotate(20 -10 -11)"/>
      <rect x="8" y="-18" width="4" height="14" fill="#f3f4f6" rx="1" transform="rotate(-20 10 -11)"/>
      <!-- Blue gloves -->
      <circle cx="-15" cy="-8" r="3" fill="#2563eb"/>
      <circle cx="15" cy="-8" r="3" fill="#2563eb"/>
    </g>

    <!-- Fighter 3 (Center - Kim - Black/Yellow) - Sumo massive stance -->
    <g transform="translate(0 12)">
      <!-- Shadow -->
      <ellipse cx="0" cy="32" rx="25" ry="5" fill="#000000" opacity="0.5"/>
      <!-- Massive legs -->
      <rect x="-10" y="5" width="8" height="25" fill="#171717" rx="1"/>
      <rect x="2" y="5" width="8" height="25" fill="#171717" rx="1"/>
      <!-- Wide torso (Mao suit) -->
      <rect x="-14" y="-22" width="28" height="28" fill="#4b5563" rx="2"/>
      <!-- Red pin badge -->
      <circle cx="-8" cy="-12" r="2" fill="#ef4444"/>
      <!-- Gold buttons -->
      <circle cx="0" cy="-15" r="1" fill="#fbbf24"/>
      <circle cx="0" cy="-8" r="1" fill="#fbbf24"/>
      <circle cx="0" cy="-1" r="1" fill="#fbbf24"/>
      <!-- Head (lighter) -->
      <circle cx="0" cy="-29" r="7" fill="#fef08a" stroke="#171717" stroke-width="0.5"/>
      <!-- Topknot hair -->
      <rect x="-7" y="-37" width="14" height="5" fill="#171717" rx="1"/>
      <!-- Sunglasses -->
      <rect x="-5" y="-31" width="4" height="2" fill="#000000"/>
      <rect x="1" y="-31" width="4" height="2" fill="#000000"/>
      <line x1="-1" y1="-30" x2="1" y2="-30" stroke="#000000" stroke-width="0.8"/>
      <!-- Black boxing gloves -->
      <circle cx="-16" cy="-5" r="4" fill="#171717"/>
      <circle cx="16" cy="-5" r="4" fill="#171717"/>
    </g>
  </g>

  <!-- ============ TITLE TEXT (top) ============ -->
  <g transform="translate(400 70)">
    <!-- Top kicker label -->
    <text x="0" y="-25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="6" opacity="0.85">
      ◆ CINEMATIC 4K BROADCAST ◆
    </text>

    <!-- Main title -->
    <text x="0" y="8" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="2" filter="url(#glow)">
      TRIPLE THREAT
    </text>

    <!-- Subtitle with boxing gloves -->
    <text x="0" y="42" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="8" opacity="0.95">
      ARENA SIMULATOR
    </text>
  </g>

  <!-- ============ DECORATIVE CORNER ACCENTS ============ -->
  <g stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top-left corner -->
    <polyline points="20,20 20,50 50,50"/>
    <!-- Top-right corner -->
    <polyline points="780,20 780,50 750,50"/>
    <!-- Bottom-left corner -->
    <polyline points="20,380 20,350 50,350"/>
    <!-- Bottom-right corner -->
    <polyline points="780,380 780,350 750,350"/>
  </g>

  <!-- ============ BOTTOM BROADCAST BADGES ============ -->
  <g transform="translate(400 380)">
    <!-- Live indicator -->
    <g transform="translate(-200 0)">
      <circle cx="0" cy="0" r="4" fill="#ef4444" filter="url(#glow)"/>
      <text x="10" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="2">
        LIVE HD
      </text>
    </g>

    <!-- Center tag -->
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#fbbf24" letter-spacing="3" opacity="0.85">
      DYNAMIC SPORTS ENGINE v1.2
    </text>

    <!-- AI badge -->
    <g transform="translate(200 0)">
      <text x="0" y="4" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981" letter-spacing="2">
        ⚡ AI-POWERED
      </text>
    </g>
  </g>

  <!-- ============ SCANLINE OVERLAY (HD broadcast) ============ -->
  <g opacity="0.03">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#ffffff" stroke-width="0.3"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-width="0.3"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#ffffff" stroke-width="0.3"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#ffffff" stroke-width="0.3"/>
  </g>
</svg>
